name: zebra
description: Integração entre Flutter e o Zebra DataWedge (TC21 e demais coletores Zebra), com isolamento de leituras por app.
version: 2.2.0
publish_to: none

environment:
  sdk: ^3.14.0
  flutter: '>=3.50.0'

dependencies:
  flutter:
    sdk: flutter
  jni: ^1.1.2
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  jnigen: ^1.0.1

flutter:
  plugin:
    platforms:
      android:
        package: br.com.srssistemas.zebra
        pluginClass: ZebraPlugin
